name: Test Variable Resolution

on:
  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest

    environment:
      name: Dev

    env:
      # Example GitHub Environment Variables
      APP_TAGS_USERNAME: ${{ vars.APP_TAGS_USERNAME }}
      APP_TAGS_URL: ${{ vars.APP_TAGS_URL }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64

          sudo chmod +x /usr/local/bin/yq

      - name: Read Variables From YAML
        run: |

          CONFIG_FILE=configs/dev/application-tags.yaml

          echo "=== YAML Content ==="
          cat "$CONFIG_FILE"

          echo ""
          echo "=== Variables Found ==="

          yq '.github_vars[]' "$CONFIG_FILE" > github_vars.txt

          cat github_vars.txt

      - name: Resolve Values
        run: |

          echo ""
          echo "=== Resolved Values ==="

          while read VAR_NAME
          do

            # remove quotes if any
            VAR_NAME=$(echo "$VAR_NAME" | tr -d '"')

            VALUE=$(printenv "$VAR_NAME")

            echo "$VAR_NAME=$VALUE"

          done < github_vars.txt
