name: Test Variable Resolution

on:
  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest

    environment:
      name: Dev

    env:
      APP_TAGS_USERNAME: ${{ vars.APP_TAGS_USERNAME }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
          https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Read Variable Name From YAML
        run: |

          USERNAME_VAR=$(yq '.github_vars.USERNAME' \
            configs/dev/application-tags.yaml)

          echo "USERNAME_VAR=$USERNAME_VAR" >> $GITHUB_ENV

      - name: Resolve Actual Value
        run: |

          USERNAME_VALUE=$(printenv "$USERNAME_VAR")

          echo "Resolved Value: $USERNAME_VALUE"

          echo "USERNAME_VALUE=$USERNAME_VALUE" >> $GITHUB_ENV

      - name: Verify
        run: |

          echo "Variable Name  : $USERNAME_VAR"
          echo "Variable Value : $USERNAME_VALUE"
