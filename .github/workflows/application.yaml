name: Test Dynamic Variable Resolution

on:
  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest

    environment:
      name: Dev

    env:
      APP_TAGS_USERNAME: ${{ vars.APP_TAGS_USERNAME }}
      APP_TAGS_URL: ${{ vars.APP_TAGS_URL }}
      TEST_VARIABLE1: ${{ vars.TEST_VARIABLE1 }}
      TEST_VARIABLE2: ${{ vars.TEST_VARIABLE2 }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
          https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64

          sudo chmod +x /usr/local/bin/yq

      - name: Read Config
        run: |

          CONFIG_FILE=configs/dev/application-tags.yaml

          echo "===== CONFIG ====="
          cat $CONFIG_FILE

          echo ""
          echo "===== VARIABLE KEYS ====="

          yq '.github_vars | keys | .[]' $CONFIG_FILE > github_vars.txt

          cat github_vars.txt

      - name: Resolve Values
        run: |

          echo ""
          echo "===== RESOLVED VALUES ====="

          while read VAR_NAME
          do

            VAR_NAME=$(echo "$VAR_NAME" | tr -d '"')

            VALUE=$(printenv "$VAR_NAME")

            echo "$VAR_NAME=$VALUE"

          done < github_vars.txt

      - name: Build Cloud Run Env String
        run: |

          ENV_VARS=""

          while read VAR_NAME
          do

            VAR_NAME=$(echo "$VAR_NAME" | tr -d '"')

            VALUE=$(printenv "$VAR_NAME")

            if [ -z "$ENV_VARS" ]; then
              ENV_VARS="${VAR_NAME}=${VALUE}"
            else
              ENV_VARS="${ENV_VARS},${VAR_NAME}=${VALUE}"
            fi

          done < github_vars.txt

          echo ""
          echo "===== GENERATED ENV STRING ====="
          echo "$ENV_VARS"

          echo "ENV_VARS=$ENV_VARS" >> $GITHUB_ENV

      - name: Example Deploy Command
        run: |

          echo "gcloud run deploy application-tags \\"
          echo "  --set-env-vars=\"$ENV_VARS\""
`
